/* Layout: soft pharmacy-shelf app. Pastel header with capsule mascot, sticky search + tabs, list of drug "pill cards" grouped by letter / group / entitlement. */
:root{
  --bg:#f3f8fb; --surface:#ffffff; --surface2:#eef4f8; --fg:#2b3445; --muted:#6b7689; --line:#dde6ee;
  --accent:#ff6f9c; --accent2:#7c6cf2; --mint:#3cc6a4; --sun:#ffc861;
  --head1:#ffe3ec; --head2:#e4e4ff; --head3:#dff6ef;
  --shadow:0 2px 0 rgba(43,52,69,.06), 0 6px 18px rgba(43,52,69,.06);
  --f-display:"Mitr","IBM Plex Sans Thai",system-ui,sans-serif;
  --f-body:"IBM Plex Sans Thai","Mitr",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:18px;
  --hx-purple:#86199a; --hx-blue:#1533d1; --hx-green:#11802b; --hx-teal:#0c7b82; --hx-orange:#d9600b; --hx-red:#d21b1b; --hx-pink:#c919ad; --hx-none:#9aa6b8;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#161a24; --surface:#1f2431; --surface2:#262c3b; --fg:#e8ecf4; --muted:#9aa3b5; --line:#323a4c;
  --accent:#ff86ab; --accent2:#a194ff; --mint:#5ed8b8; --sun:#ffd27e;
  --head1:#3a2532; --head2:#2a2848; --head3:#1f3a35; --shadow:0 2px 0 rgba(0,0,0,.25);
  --hx-purple:#d48ae6; --hx-blue:#8fa2ff; --hx-green:#6fd38a; --hx-teal:#5ccfd6; --hx-orange:#ffa05a; --hx-red:#ff7b7b; --hx-pink:#ff7ce6; --hx-none:#6d7890;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#161a24; --surface:#1f2431; --surface2:#262c3b; --fg:#e8ecf4; --muted:#9aa3b5; --line:#323a4c;
  --accent:#ff86ab; --accent2:#a194ff; --mint:#5ed8b8; --sun:#ffd27e;
  --head1:#3a2532; --head2:#2a2848; --head3:#1f3a35; --shadow:0 2px 0 rgba(0,0,0,.25);
  --hx-purple:#d48ae6; --hx-blue:#8fa2ff; --hx-green:#6fd38a; --hx-teal:#5ccfd6; --hx-orange:#ffa05a; --hx-red:#ff7b7b; --hx-pink:#ff7ce6; --hx-none:#6d7890;
  color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.5}
.wrap{max-width:960px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.hero{background:linear-gradient(120deg,var(--head1),var(--head2) 55%,var(--head3));border-radius:0 0 28px 28px}
.hero .wrap{display:flex;align-items:center;gap:16px;padding-block:22px 26px}
.hero h1{font-family:var(--f-display);font-weight:600;font-size:clamp(22px,4.6vw,32px);margin:0;line-height:1.2;text-wrap:balance}
.hero p{margin:4px 0 0;color:var(--muted);font-size:14px}
.mascot{flex:none;width:72px;height:72px}
.mascot .blink{animation:blink 4s infinite}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
@media (prefers-reduced-motion:reduce){.mascot .blink{animation:none}}

body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:12px 4px;box-shadow:0 8px 12px -10px rgba(43,52,69,.18)}
.search{position:relative}
.search input{width:100%;font:inherit;font-size:16px;padding:14px 46px 14px 48px;border-radius:999px;border:2px solid var(--line);background:var(--surface);color:var(--fg);box-shadow:var(--shadow);outline:none}
.search input:focus{border-color:var(--accent)}
.search svg{position:absolute;left:16px;top:50%;transform:translateY(-50%);width:20px;height:20px;color:var(--accent)}
.search button{position:absolute;right:8px;top:50%;transform:translateY(-50%);border:0;background:var(--surface2);color:var(--muted);width:32px;height:32px;border-radius:50%;cursor:pointer;font-size:16px}
.tabs{display:flex;gap:6px;margin-top:12px;background:var(--surface2);padding:5px;border-radius:999px}
.tabs button{flex:1;border:0;background:transparent;color:var(--muted);font-family:var(--f-display);font-size:15px;padding:9px 6px;border-radius:999px;cursor:pointer;white-space:nowrap}
.tabs button[aria-selected="true"]{background:var(--surface);color:var(--fg);box-shadow:var(--shadow)}
.tabs button[aria-selected="true"] .dot{background:var(--accent)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--line);margin-right:6px;vertical-align:middle}
.filters{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;margin-top:10px}
@media (max-width:860px){.filters{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:640px){.filters{grid-template-columns:repeat(2,minmax(0,1fr))}.filters label:last-child{grid-column:1/-1}}
.filters label{display:flex;flex-direction:column;gap:2px;font-size:12px;color:var(--muted);letter-spacing:.02em;min-width:0}
.filters select{font:inherit;font-size:14px;color:var(--fg);background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:8px 10px;width:100%;min-width:0}
.filters select.on{border-color:var(--accent2);background:color-mix(in oklab,var(--accent2) 10%,var(--surface))}
.status{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:10px 0 8px;font-size:13px;color:var(--muted);border-bottom:1px dashed var(--line)}
.status b{color:var(--fg);font-family:var(--f-display);font-weight:500;font-size:15px}
.clear{border:0;background:none;color:var(--accent);font:inherit;font-size:13px;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.letters:empty{display:none}
.letters{display:flex;gap:4px;overflow-x:auto;padding:8px 0 6px;scrollbar-width:thin}
.letters a{flex:none;min-width:28px;height:28px;display:grid;place-items:center;border-radius:9px;background:var(--surface);border:1px solid var(--line);color:var(--fg);text-decoration:none;font-family:var(--f-display);font-size:13px}
.letters a:hover{border-color:var(--accent);color:var(--accent)}
.letters a.off{opacity:.3;pointer-events:none}
.letters .sep{flex:none;width:1px;background:var(--line);margin:0 4px}

main{padding-block:8px 60px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px;margin:8px 0 18px}
.gcard{display:flex;align-items:center;gap:10px;text-align:left;border:1.5px solid var(--line);background:var(--surface);color:var(--fg);border-radius:16px;padding:10px 12px;cursor:pointer;font:inherit;min-width:0}
.gcard:hover{border-color:var(--hue)}
.gcard.on{border-color:var(--hue);background:color-mix(in oklab,var(--hue) 14%,var(--surface))}
.gcard .nm{flex:1;min-width:0;font-size:14px;line-height:1.3}
.gcard .ct{font-family:var(--f-display);font-size:13px;color:var(--muted)}
.cap{flex:none;width:12px;height:26px;border-radius:8px;background:linear-gradient(var(--hue) 50%,color-mix(in oklab,var(--hue) 35%,var(--surface)) 50%)}
section.grp{margin-top:18px;scroll-margin-top:170px}
section.grp>h2{display:flex;align-items:center;gap:10px;font-family:var(--f-display);font-weight:500;font-size:19px;margin:0 0 8px}
section.grp>h2 .big{display:grid;place-items:center;width:36px;height:36px;border-radius:12px;background:var(--surface);border:2px solid var(--hue,var(--accent));color:var(--hue,var(--accent));font-size:18px}
section.grp>h2 small{font-family:var(--f-body);font-size:13px;color:var(--muted);font-weight:400}
.list{display:flex;flex-direction:column;gap:6px}
.drug{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;font:inherit;color:inherit;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 14px;cursor:pointer}
.drug:hover,.drug:focus-visible{border-color:var(--accent);outline:none;box-shadow:var(--shadow)}
.drug .cap{margin-top:3px}
.drug .body{flex:1;min-width:0}
.drug .n{font-weight:600;overflow-wrap:anywhere}
.drug .t{font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:5px}
.chip{font-size:12px;line-height:1;padding:5px 9px;border-radius:999px;background:var(--surface2);color:var(--muted);white-space:nowrap}
.chip.pay{background:var(--surface2);color:var(--fg);font-weight:500}
.chip.k{border:1px solid var(--line);background:transparent}
.chip.sp{background:color-mix(in oklab,var(--accent) 16%,var(--surface));color:color-mix(in oklab,var(--accent) 65%,var(--fg))}
.drug .n{color:var(--hx,var(--fg))}
.legend{margin-top:10px;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:4px 14px}
.legend summary{cursor:pointer;font-family:var(--f-display);font-size:15px;padding:8px 0;list-style:none;display:flex;align-items:center;gap:8px}
.legend summary::-webkit-details-marker{display:none}
.legend summary::after{content:"▾";margin-left:auto;color:var(--muted);transition:transform .2s}
.legend[open] summary::after{transform:rotate(180deg)}
.legend .sw{display:inline-flex;gap:3px}.legend .sw i{width:8px;height:8px;border-radius:50%;background:var(--c)}
.hx-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:6px;padding:4px 0 12px}
.hx{display:flex;align-items:flex-start;gap:10px;text-align:left;font:inherit;color:inherit;background:var(--surface2);border:1.5px solid transparent;border-radius:14px;padding:8px 10px;cursor:pointer;min-width:0}
.hx:hover{border-color:var(--c)}
.hx.on{border-color:var(--c);background:color-mix(in oklab,var(--c) 14%,var(--surface))}
.hx .cap{--hue:var(--c);margin-top:2px}
.hx b{display:block;color:var(--c);font-weight:600;font-size:14px}
.hx small{display:block;color:var(--muted);font-size:12px;line-height:1.35}
.hx .ct{margin-left:auto;font-family:var(--f-display);font-size:13px;color:var(--muted)}
.hx-tag{font-weight:600;color:var(--hx)}
mark{background:color-mix(in oklab,var(--sun) 55%,transparent);color:inherit;border-radius:4px;padding:0 1px}
.empty{text-align:center;padding:50px 10px;color:var(--muted)}
.empty .face{font-family:var(--f-display);font-size:34px;color:var(--accent)}
.more{display:block;margin:10px auto 0;border:1.5px dashed var(--line);background:none;color:var(--muted);font:inherit;padding:8px 16px;border-radius:999px;cursor:pointer}

dialog{border:0;padding:0;border-radius:24px;max-width:min(560px,calc(100vw - 24px));width:100%;background:var(--surface);color:var(--fg);box-shadow:0 20px 60px rgba(0,0,0,.25)}
dialog::backdrop{background:rgba(30,35,50,.4)}
.dlg-head{padding:20px 22px 14px;background:color-mix(in oklab,var(--hue) 16%,var(--surface));position:relative}
.dlg-head h3{color:var(--hx,var(--fg));margin:0;font-family:var(--f-display);font-weight:500;font-size:20px;line-height:1.3;padding-right:36px;overflow-wrap:anywhere}
.dlg-head .x{position:absolute;right:14px;top:14px;border:0;background:var(--surface);color:var(--fg);width:34px;height:34px;border-radius:50%;cursor:pointer;font-size:18px}
.dlg-body{padding:14px 22px 22px;max-height:65vh;overflow:auto}
dl{display:grid;grid-template-columns:max-content 1fr;gap:8px 14px;margin:0}
dt{color:var(--muted);font-size:13px}
dd{margin:0;overflow-wrap:anywhere}
.box{margin-top:14px;padding:12px 14px;border-radius:14px;background:var(--surface2)}
.box h4{margin:0 0 8px;font-family:var(--f-display);font-weight:500;font-size:15px}
.copy{margin-top:14px;border:0;background:var(--accent);color:#fff;font:inherit;font-weight:500;padding:9px 16px;border-radius:999px;cursor:pointer}
footer{color:var(--muted);font-size:12px;text-align:center;padding-bottom:30px}
:focus-visible{outline:2px solid var(--accent2);outline-offset:2px}
@media (max-width:420px){.tabs button{font-size:13.5px}.tabs .dot{display:none}}
</style>

 DALS:'น้ำยาล้างไต',PWD:'ยาผง',GEL:'เจล',OINT:'ขี้ผึ้ง',NAS:'ยาพ่นจมูก',IR:'น้ำยาล้าง',SUPPO:'ยาเหน็บ',MIXT:'ยาน้ำผสม',EAD:'ยาหยอดหู',
 TRAN:'แผ่นแปะผิวหนัง',VT:'ยาเหน็บช่องคลอด',NEB:'ยาพ่นฝอยละออง',SPRAY:'สเปรย์',INHL:'ยาสูดดม',ELIX:'อีลิกเซอร์',PATCH:'แผ่นแปะ',LIQ:'ของเหลว',
 LOT:'โลชั่น',EYG:'เจลป้ายตา',EYO:'ขี้ผึ้งป้ายตา',IMPL:'ยาฝัง',ENEM:'ยาสวน',PASTE:'ยาป้าย',HERB:'สมุนไพร',INTC:'INTC',ORD:'ORD'};
const LIST = {main:'บัญชียาหลัก รพ.',USC:'รายการ USC',sp:'ยาเฉพาะราย'};
const hue = h => 'var(--accent2)';
const HX = {
 purple:['สีม่วง','รายการยา OCPA / ยามูลค่าสูง','มีแบบกำกับขออนุมัติ แพทย์ staff ถึง ผอ.'],
 blue:['สีน้ำเงิน','High alert drugs (HAD)','ยาที่ต้องระวังสูง'],
 green:['สีเขียว','staff สั่งใช้-จ่ายได้เลย','หรือสั่งได้แต่ต้องมีใบกำกับ'],
 teal:['สีฟ้าพาสเทล','ยาในบัญชียาหลักแห่งชาติ จ2','มีแบบกำกับขออนุมัติ'],
 orange:['สีส้ม','ยาที่ต้องชำระเงินเองทุกสิทธิ',''],
 red:['สีแดง','ยา NED เฉพาะเบิกได้','ไม่จ่ายฟรี'],
 pink:['สีชมพู','Restrict drugs (ATB)','มีแบบประกอบการสั่งใช้ R1–R4'],
 none:['สีปกติ','ยาทั่วไป','ไม่อยู่ในกลุ่มสีพิเศษ']
};
const hxc = x => `var(--hx-${x})`;
function classify(d){
  const txt = [d.n,d.t,d.p,d.sp?.note].filter(Boolean).join(' ');
  if (/\(HAD\)|high[ -]?alert/i.test(txt)) return 'blue';
  if (d.pc==='restr' || /restrict/i.test(txt)) return 'pink';
  if (d.pc==='dir' || /OCPA/i.test(txt) || /อนุมัติ.{0,12}ผอ/.test(txt)) return 'purple';
  if (d.pc==='j2' || d.k==='R2' || d.sp?.ac==='จ2') return 'teal';
  if (d.pc==='noclaim' || /ชำระ(เงิน)?เอง(?!ไปเบิก)/.test(txt)) return 'orange';
  if ((d.k==='NED' || /NED/.test(d.n)) && ['pay','claim','case'].includes(d.pc)) return 'red';
  if (d.pc==='staff' || /อนุมัติ\s*staff/i.test(d.p)) return 'green';
  return 'none';
}
const esc = s => String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const collEn = new Intl.Collator('en',{sensitivity:'base',numeric:true});
const collTh = new Intl.Collator('th',{sensitivity:'base',numeric:true});
const TH_LEAD = /^[เแโใไ]/;
const EN_LETTERS = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('');
const TH_LETTERS = 'กขคฆงจฉชซฌญฎฏฐฑฒณดตถทธนบปผฝพฟภมยรลวศษสหฬอฮ'.split('');

let DRUGS = [];
const S = {q:'', view:'az', g:'', p:'', k:'', f:'', x:'', limit:{}};

function prep(d, i){
  d.i = i;
  const key = d.n.replace(/^[^A-Za-zก-ฮเ-ไ]+/,'');
  d.key = key;
  d.en = /^[A-Za-z]/.test(key);
  if (d.en) d.L = key[0].toUpperCase();
  else { const k = key.replace(TH_LEAD,''); d.L = k[0] || '#'; }
  d.list = d.pc==='case' ? 'sp' : (d.l==='USC' ? 'USC' : 'main');
  d.x = classify(d);
  d.hay = [d.n,d.t,d.c,d.sp?.th,d.sp?.tp,d.sp?.note].filter(Boolean).join(' ').toLowerCase();
}
function sortAll(a){
  return a.sort((x,y)=> x.en!==y.en ? (x.en?-1:1) : (x.en ? collEn.compare(x.key,y.key) : collTh.compare(x.key,y.key)));
}

function opts(sel, entries, all){
  sel.innerHTML = `<option value="">${all}</option>` + entries.map(([v,l,c])=>`<option value="${esc(v)}">${esc(l)} (${c})</option>`).join('');
}
function countBy(f){ const m={}; DRUGS.forEach(d=>{const v=f(d); m[v]=(m[v]||0)+1}); return m; }
function buildFilters(){
  const g = countBy(d=>d.g), p = countBy(d=>d.pc), k = countBy(d=>d.k), f = countBy(d=>d.f||'-');
  opts($('fg'), GORDER.filter(x=>g[x]).map(x=>[x,GROUPS[x][0],g[x]]), 'ทุกกลุ่ม');
  opts($('fp'), Object.keys(PAY).filter(x=>p[x]).map(x=>[x,PAY[x][0],p[x]]), 'ทุกสิทธิ');
  const kk = Object.keys(k).filter(Boolean).sort((a,b)=>k[b]-k[a]).map(x=>[x,KIND[x]||x,k[x]]);
  const l = countBy(d=>d.list);
  opts($('fk'), [...kk, ...Object.keys(LIST).map(x=>['list:'+x, LIST[x], l[x]||0])], 'ทุกประเภท');
  const x = countBy(d=>d.x);
  opts($('fx'), Object.keys(HX).map(k=>[k, HX[k][0]+' · '+HX[k][1], x[k]||0]), 'ทุกสี');
  opts($('ff'), Object.keys(f).sort((a,b)=>f[b]-f[a]).map(x=>[x, x==='-'?'ไม่ระบุ':(FORM[x]||x)+(FORM[x]&&FORM[x]!==x?` · ${x}`:''), f[x]]), 'ทุกรูปแบบ');
}
const $ = id => document.getElementById(id);

function filtered(){
  const toks = S.q.toLowerCase().split(/\s+/).filter(Boolean);
  return DRUGS.filter(d =>
    (!S.g || d.g===S.g) && (!S.p || d.pc===S.p) && (!S.x || d.x===S.x) && (!S.f || (d.f||'-')===S.f) &&
    (!S.k || (S.k.startsWith('list:') ? d.list===S.k.slice(5) : d.k===S.k)) &&
    toks.every(t => d.hay.includes(t)));
}
function hl(text){
  let s = esc(text);
  const toks = S.q.toLowerCase().split(/\s+/).filter(Boolean).map(t=>esc(t).replace(/[.*+?^${}()|[\]\\]/g,'\\$&'));
  if (!toks.length) return s;
  return s.replace(new RegExp('('+toks.join('|')+')','gi'),'<mark>$1</mark>');
}
function row(d){
  const pay = PAY[d.pc]||PAY.na, g = GROUPS[d.g]||GROUPS['00'];
  const sub = [d.t, d.sp?.th].filter(Boolean).join(' · ');
  const hx = d.x==='none' ? '' : `--hx:${hxc(d.x)};`;
  return `<button class="drug" data-i="${d.i}" style="${hx}--hue:${hxc(d.x)}"><span class="cap"></span><span class="body">
    <span class="n">${hl(d.n)}</span>${sub?`<div class="t">${hl(sub)}</div>`:''}
    <span class="chips"><span class="chip pay">${esc(pay[0])}</span>
    ${d.f?`<span class="chip">${esc(FORM[d.f]||d.f)}</span>`:''}
    ${d.k?`<span class="chip k">${esc(KIND[d.k]||d.k)}</span>`:''}
    ${d.list!=='main'?`<span class="chip sp">${esc(LIST[d.list])}</span>`:''}
    ${S.view!=='grp'?`<span class="chip">${esc(g[0])}</span>`:''}</span></span></button>`;
}
const PAGE = 120;
function section(id, title, big, h, items, sub){
  const lim = S.limit[id] || PAGE;
  return `<section class="grp" id="s-${esc(id)}" style="${h!=null?`--hue:${hue(h)}`:''}"><h2><span class="big">${esc(big)}</span><span>${esc(title)} <small>${items.length} รายการ${sub?` · ${esc(sub)}`:''}</small></span></h2>
   <div class="list">${items.slice(0,lim).map(row).join('')}</div>
   ${items.length>lim?`<button class="more" data-more="${esc(id)}">แสดงอีก ${items.length-lim} รายการ</button>`:''}</section>`;
}
function render(){
  const res = filtered();
  $('count').textContent = res.length.toLocaleString('th-TH');
  const act = [];
  if (S.g) act.push(GROUPS[S.g][0]); if (S.p) act.push(PAY[S.p][0]);
  if (S.k) act.push(S.k.startsWith('list:')?LIST[S.k.slice(5)]:(KIND[S.k]||S.k)); if (S.f) act.push(FORM[S.f]||S.f); if (S.x) act.push(HX[S.x][0]);
  $('active').textContent = act.length ? '· ' + act.join(' · ') : '';
  $('clear').hidden = !(act.length || S.q);
  ['fg','fp','fk','ff','fx'].forEach(id=>$(id).classList.toggle('on', !!$(id).value));
  const xc = countBy(d=>d.x);
  $('hxList').innerHTML = Object.keys(HX).map(k=>`<button class="hx ${S.x===k?'on':''}" data-x="${k}" style="--c:${hxc(k)}"><span class="cap"></span><span><b>${HX[k][0]} · ${esc(HX[k][1])}</b>${HX[k][2]?`<small>${esc(HX[k][2])}</small>`:''}</span><span class="ct">${xc[k]||0}</span></button>`).join('');
  let html = '';
  const letters = $('letters');
  if (!res.length){
    letters.innerHTML='';
    $('main').innerHTML = `<div class="empty"><div class="face">(・_・;)</div><p>ไม่พบยาที่ตรงกับคำค้นหรือตัวกรอง<br>ลองพิมพ์ชื่อสั้นลง หรือกด “ล้างตัวกรองทั้งหมด”</p></div>`;
    return;
  }
  if (S.view==='az'){
    const by = {}; res.forEach(d=>{(by[d.L]=by[d.L]||[]).push(d)});
    const order = [...EN_LETTERS, ...TH_LETTERS, ...Object.keys(by).filter(k=>!EN_LETTERS.includes(k)&&!TH_LETTERS.includes(k))];
    letters.innerHTML = EN_LETTERS.map(l=>`<a href="#s-${l}" class="${by[l]?'':'off'}">${l}</a>`).join('') + '<span class="sep"></span>' +
      TH_LETTERS.map(l=>`<a href="#s-${l}" class="${by[l]?'':'off'}">${l}</a>`).join('');
    order.forEach(l=>{ if(by[l]) html += section(l, EN_LETTERS.includes(l)?`หมวด ${l}`:`หมวด ${l}`, l, null, by[l]); });
  } else if (S.view==='grp'){
    letters.innerHTML='';
    const by = {}; res.forEach(d=>{(by[d.g]=by[d.g]||[]).push(d)});
    html += `<div class="cards">${GORDER.filter(g=>by[g]||S.g===g).map(g=>`<button class="gcard ${S.g===g?'on':''}" data-g="${g}" style="--hue:${hue(GROUPS[g][1])}"><span class="cap"></span><span class="nm">${esc(GROUPS[g][0])}</span><span class="ct">${(by[g]||[]).length}</span></button>`).join('')}</div>`;
    GORDER.forEach(g=>{ if(by[g]) html += section('g'+g, GROUPS[g][0], g==='IV'?'IV':g==='00'?'?':String(+g), GROUPS[g][1], by[g]); });
  } else {
    letters.innerHTML='';
    const by = {}; res.forEach(d=>{(by[d.pc]=by[d.pc]||[]).push(d)});
    html += `<div class="cards">${Object.keys(PAY).filter(p=>by[p]||S.p===p).map(p=>`<button class="gcard ${S.p===p?'on':''}" data-p="${p}" style="--hue:${hue(PAY[p][1])}"><span class="cap"></span><span class="nm">${esc(PAY[p][0])}</span><span class="ct">${(by[p]||[]).length}</span></button>`).join('')}</div>`;
    Object.keys(PAY).forEach(p=>{ if(by[p]) html += section('p'+p, PAY[p][0], '฿', PAY[p][1], by[p]); });
  }
  $('main').innerHTML = html;
}
function openDrug(d){
  const g = GROUPS[d.g]||GROUPS['00'], pay = PAY[d.pc]||PAY.na;
  $('dlgHead').style.setProperty('--hue', hxc(d.x));
  $('dlgHead').style.setProperty('--hx', d.x==='none'?'var(--fg)':hxc(d.x));
  $('dlgTitle').textContent = d.n;
  const rows = [
    ['ชื่อการค้า', d.t], ['ชื่อภาษาไทย', d.sp?.th], ['รหัสยา', d.c], ['กลุ่มยา', g[0]],
    ['รูปแบบ', d.f ? `${FORM[d.f]||d.f} (${d.f})` : ''], ['ประเภทบัญชี', d.k ? (KIND[d.k]||d.k) : ''],
    ['สี HOSxP', `<span class="hx-tag">${HX[d.x][0]} · ${esc(HX[d.x][1])}</span>`], ['สิทธิ / การจ่าย', pay[0]], ['ข้อความในบัญชี', d.p], ['รายการ', LIST[d.list]],
  ].filter(r=>r[1]);
  let sp = '';
  if (d.sp){
    const s = d.sp, r2 = [['ชื่อในระบบ', s.note], ['Strength', s.str], ['Dispensing unit', s.u], ['TMT TPU (สกส.)', s.tp],
      ['บัญชียาหลักฯ', s.ac && s.ac!=='-' ? s.ac : (s.ac==='-'?'นอกบัญชี':'')], ['ราคาจำหน่าย', s.pr!=null ? s.pr.toLocaleString('th-TH')+' บาท' : '']].filter(r=>r[1]);
    sp = `<div class="box"><h4>ข้อมูลจากรายการยาเฉพาะราย</h4><dl>${r2.map(r=>`<dt>${r[0]}</dt><dd>${esc(r[1])}</dd>`).join('')}</dl></div>`;
  }
  $('dlgBody').innerHTML = `<dl>${rows.map(r=>`<dt>${r[0]}</dt><dd>${r[0]==='สี HOSxP'?r[1]:esc(r[1])}</dd>`).join('')}</dl>${sp}<button class="copy" id="copyBtn" type="button">คัดลอกชื่อยา</button>`;
  $('copyBtn').onclick = e => {
    const b = e.currentTarget;
    navigator.clipboard?.writeText(d.n).then(()=>{b.textContent='คัดลอกแล้ว ✓'}, ()=>{b.textContent='คัดลอกไม่ได้ ลองเลือกข้อความเอง'});
  };
  $('dlg').showModal();
}

function setView(v){
  S.view = v;
  document.querySelectorAll('.tabs button').forEach(b=>b.setAttribute('aria-selected', b.dataset.v===v));
  try{ localStorage.setItem('formulary-view', v) }catch(e){}
  render(); window.scrollTo({top:0});
}
let tmr;
function init(data){
  DRUGS = sortAll(data.map((d,i)=>(prep(d,i),d)));
  DRUGS.forEach((d,i)=>d.i=i);
    buildFilters();
  try{ const v = localStorage.getItem('formulary-view'); if (v && ['az','grp','pay'].includes(v)) S.view = v }catch(e){}
  document.querySelectorAll('.tabs button').forEach(b=>{ b.setAttribute('aria-selected', b.dataset.v===S.view); b.onclick=()=>setView(b.dataset.v) });
  $('q').addEventListener('input', e=>{ clearTimeout(tmr); $('qx').hidden=!e.target.value; tmr=setTimeout(()=>{S.q=e.target.value.trim(); S.limit={}; render()},120) });
  $('qx').onclick = ()=>{ $('q').value=''; $('qx').hidden=true; S.q=''; render(); $('q').focus() };
  [['fg','g'],['fp','p'],['fk','k'],['ff','f'],['fx','x']].forEach(([id,k])=>$(id).onchange=e=>{S[k]=e.target.value; S.limit={}; render()});
  $('clear').onclick = ()=>{ Object.assign(S,{q:'',g:'',p:'',k:'',f:'',x:'',limit:{}}); $('q').value=''; $('qx').hidden=true; ['fg','fp','fk','ff','fx'].forEach(id=>$(id).value=''); render() };
  $('main').addEventListener('click', e=>{
    const dr = e.target.closest('.drug'); if (dr) return openDrug(DRUGS[+dr.dataset.i]);
    const m = e.target.closest('[data-more]'); if (m){ S.limit[m.dataset.more]=1e9; return render() }
    const gc = e.target.closest('[data-g]'); if (gc){ S.g = S.g===gc.dataset.g?'':gc.dataset.g; $('fg').value=S.g; return render() }
    const pc = e.target.closest('[data-p]'); if (pc){ S.p = S.p===pc.dataset.p?'':pc.dataset.p; $('fp').value=S.p; return render() }
  });
  $('hxList').addEventListener('click', e=>{ const b=e.target.closest('[data-x]'); if(!b) return; S.x = S.x===b.dataset.x?'':b.dataset.x; $('fx').value=S.x; S.limit={}; render() });
  let lg=null; try{ lg=localStorage.getItem('formulary-legend') }catch(e){}
  if (lg==='closed' || (!lg && matchMedia('(max-width:640px)').matches)) $('legend').open=false;
  $('legend').addEventListener('toggle', ()=>{ try{ localStorage.setItem('formulary-legend', $('legend').open?'open':'closed') }catch(e){} });
  $('letters').addEventListener('click', e=>{ const a=e.target.closest('a'); if(!a) return; e.preventDefault(); document.querySelector(a.getAttribute('href'))?.scrollIntoView({behavior:'smooth'}) });
  $('dlgX').onclick = ()=>$('dlg').close();
  $('dlg').addEventListener('click', e=>{ if (e.target===$('dlg')) $('dlg').close() });
  render();
}
if (window.DRUG_DATA) init(window.DRUG_DATA);
else fetch('data.json').then(r=>r.json()).then(init).catch(()=>{ $('main').innerHTML='<div class="empty"><p>โหลดข้อมูลยาไม่สำเร็จ ลองรีเฟรชหน้าอีกครั้ง</p></div>' });
</script>

</html>
